<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>새 5보스 효과음 검수</title>
  <style>
    #checks {position:fixed;z-index:100;left:12px;bottom:12px;width:min(600px,calc(100vw - 24px));max-height:94vh;overflow:auto;box-sizing:border-box;padding:14px;background:#172b36f2;color:white;border-radius:12px;font:14px/1.5 sans-serif}
    h1 {font-size:18px;margin:0 0 6px} p {margin:6px 0} button {padding:9px 14px;cursor:pointer}
    #sounds {display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0} label {font-size:12px} audio {display:block;width:100%;height:28px}
    #results {max-height:160px;overflow:auto;white-space:pre-wrap;font-size:12px;margin-bottom:0}
  </style>
</head>
<body data-audio-review="true">
  <main id="app"><div id="game-container" tabindex="0" aria-label="게임 화면"></div><p id="game-status" class="sr-only" role="status"></p></main>
  <aside id="checks">
    <h1>새 5보스 효과음 검수</h1><p>공격 7종·약점 5종을 들어볼 수 있습니다. 검증은 실제 전투 15타격을 진행합니다.</p>
    <div id="sounds"></div><button id="run" disabled>준비 중</button><pre id="results" tabindex="0" role="status">Loading…</pre>
  </aside>
  <script type="module" src="./boss-audio-runtime.js"></script>
</body>
</html>
