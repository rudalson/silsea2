<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>새 5코스 음악 검수</title>
  <style>
    #checks { position:fixed;z-index:100;left:12px;bottom:12px;width:min(560px,calc(100vw - 24px));max-height:94vh;overflow:auto;box-sizing:border-box;padding:14px;background:#172b36f2;color:white;border-radius:12px;font:14px/1.5 sans-serif; }
    h1 {font-size:18px;margin:0 0 6px} p {margin:6px 0} button {padding:9px 14px;cursor:pointer}
    table {width:100%;border-collapse:collapse;margin:8px 0} th,td {text-align:left;padding:4px} audio {width:180px;height:30px;max-width:24vw}
    #results {max-height:135px;overflow:auto;white-space:pre-wrap;font-size:12px;margin-bottom:0} #run-status {color:#b6f6de}
  </style>
</head>
<body>
  <main id="app"><div id="game-container" tabindex="0" aria-label="게임 화면"></div><p id="game-status" class="sr-only" role="status"></p></main>
  <aside id="checks">
    <h1>새 5코스 음악 검수</h1><p>필드곡과 보스 편곡을 각각 들어볼 수 있습니다.</p>
    <table><thead><tr><th>코스</th><th>필드</th><th>보스</th></tr></thead><tbody id="tracks"></tbody></table>
    <button id="run" disabled>준비 중</button><p id="run-status" role="status">Loading…</p><pre id="results" tabindex="0"></pre>
  </aside>
  <script type="module" src="./expansion-audio-runtime.js"></script>
</body>
</html>
